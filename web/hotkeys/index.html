<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://vlss5.shared/style.css">
</head>
<body>
  <div class="titlebar">
    <div class="title">Kısayol Tuşları</div>
    <div class="titlebar-btns"><div class="wbtn close" id="btnClose">&#10005;</div></div>
  </div>
  <div class="content">
    <div class="hotkey-row"><div class="label">Uygulamayı Başlat:</div><button class="rebind" id="btnStart"></button></div>
    <div class="hotkey-row"><div class="label">VLSS5 Ayarları:</div><button class="rebind" id="btnSettings"></button></div>
    <div class="hotkey-row"><div class="label">Oyuna Odaklan:</div><button class="rebind" id="btnFocus"></button></div>
    <div class="hotkey-row"><div class="label">FPS Göstergesi:</div><button class="rebind" id="btnFps"></button></div>
    <div class="hotkey-row"><div class="label">VLSS5 Aç/Kapat:</div><button class="rebind" id="btnVlss"></button></div>
    <div class="hotkey-row"><div class="label">FPS Kalibrasyonu:</div><button class="rebind" id="btnCalib"></button></div>
    <div class="hotkey-row"><div class="label">GPU Uyarısını Kapat:</div><button class="rebind" id="btnDismissWarning"></button></div>
  </div>
  <script src="https://vlss5.shared/ipc.js"></script>
  <script src="app.js"></script>
</body>
</html>
