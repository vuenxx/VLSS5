<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://vlss5.shared/style.css">
</head>
<body>
  <div class="titlebar">
    <div class="title">RTSS Ayarları</div>
    <div class="titlebar-btns"><div class="wbtn close" id="btnClose">&#10005;</div></div>
  </div>
  <div class="content">
    <div class="row">
      <label class="field-title">RTSS Klasörü:</label>
      <button class="secondary" id="btnBrowse">Klasör Seç</button>
      <div class="path-display" id="dirPath"></div>
    </div>

    <div class="row">
      <label class="field-title">Profiller:</label>
      <div style="display:flex; gap:10px;">
        <select id="profileList" style="flex:1"></select>
        <button class="secondary" id="btnRefresh">Yenile</button>
      </div>
    </div>

    <button class="danger" id="btnDelete" style="width:100%">Profili Sil</button>
  </div>
  <script src="https://vlss5.shared/ipc.js"></script>
  <script src="app.js"></script>
</body>
</html>
