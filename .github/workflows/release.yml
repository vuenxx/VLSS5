name: Release

# "v*" bicimindeki bir git tag push edildiginde (orn. v0.6.0) tetiklenir:
# 1) VLSS5.vcxproj'u Release|x64 derler,
# 2) VLSS5.exe + web/* + redist/nvngx.dll_dlssnr.dll'i bir "portable" klasorde
#    toplayip VLSS5-<surum>-portable.zip olarak sikistirir (+ .sha256'sini,
#    kullanicilarin ELLE dogrulamak isterse diye -- ZIP'i kimse otomatik
#    calistirmiyor/dogrulamiyor, uygulamanin KENDI icinde artik hicbir
#    guncelleme kontrolu/indirme/kurulum mantigi YOK, bkz. asagidaki not),
# 3) GitHub Release'i TASLAK (draft) olarak olusturur -- asset ekli, ama
#    HENUZ YAYIMLANMAMIS. Tag push etmek dogrudan kullanicilara bir sey
#    yapmaz -- GitHub'da Releases sayfasindan taslagi inceleyip/duzenleyip
#    "Publish release"e SIZ basana kadar hicbir sey yayimlanmaz.
#
# NOT: VLSS5 ARTIK KENDI KENDINI GUNCELLEMIYOR. Eskiden uygulama icinde bir
# "Güncellemeler" sekmesi vardi (GitHub Releases'i kontrol edip bir installer/
# ZIP indirip sessizce calistiriyordu) -- bu TAMAMEN KALDIRILDI (src/UpdateChecker.*
# silindi, Main.cpp'deki StartUpdatesCheck/StartUpdatesDownload/
# LaunchPortableUpdateAndExit ve ilgili tum WM_APP_UPDATES_* / "updates*" IPC
# komutlari kaldirildi). Sebep: bu mekanizma (ozellikle eski Inno Setup
# installer.exe'si -- imzasiz, admin isteyen, sessiz/otomatik kurulum,
# calisan bir process'i kapatip yeniden baslatan self-extracting bir exe)
# Windows Defender'in ML heuristigine (Wacatac.B!ml) tekrar tekrar "dropper"
# gibi gorundu. Bu workflow artik SADECE bir dagitim paketi uretiyor --
# kullanicilar GitHub Releases sayfasindan ELLE indirir. installer/VLSS5.iss
# dosyasi repoda duruyor ama hicbir pipeline onu kullanmiyor.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Surum numarasi (orn. 0.6.0) -- workflow_dispatch ile elle tetiklemede gerekli"
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            # "refs/tags/v0.6.0" -> "0.6.0"
            tag="${GITHUB_REF_NAME}"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Write version header
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $content = '#define VLSS5_VERSION_STRING L"' + $version + '"'
          Set-Content -Path "src/VersionGenerated.h" -Encoding utf8 -Value $content
          Get-Content "src/VersionGenerated.h"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build VLSS5 (Release|x64)
        run: msbuild VLSS5.vcxproj /p:Configuration=Release /p:Platform=x64 /m /nologo

      # Calisma zamaninda uretilen kullanici verisi (vlss5_config.ini,
      # vlss5_logs.log, crashreporter\) buraya HICBIR ZAMAN dahil edilmez --
      # sadece uygulamanin kendisi.
      - name: Stage portable package
        shell: pwsh
        run: |
          $staging = "dist/VLSS5"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "x64/Release/VLSS5.exe" -Destination $staging
          Copy-Item "x64/Release/web" -Destination "$staging/web" -Recurse
          if (Test-Path "redist/nvngx.dll_dlssnr.dll") {
            Copy-Item "redist/nvngx.dll_dlssnr.dll" -Destination $staging
          }
          if (Test-Path "beni oku.txt") {
            Copy-Item "beni oku.txt" -Destination $staging
          }
          Get-ChildItem -Recurse $staging

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zip = "dist/VLSS5-$version-portable.zip"
          Compress-Archive -Path "dist/VLSS5/*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$zip.sha256" -Encoding ascii -Value $hash -NoNewline

      - name: Create GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: true
          files: |
            dist/VLSS5-${{ steps.version.outputs.version }}-portable.zip
            dist/VLSS5-${{ steps.version.outputs.version }}-portable.zip.sha256
